name: Visual Pipeline Smoke Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, "aj-smoke-test" ]
  workflow_dispatch:

jobs:
  smoke_test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run smoke tests
      run: |
        python -m shell_scripts.ci_smoke_test

    - name: Upload simulation artifacts for visual review
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: simulation-outputs
        path: out/
        retention-days: 7
        compression-level: 0
